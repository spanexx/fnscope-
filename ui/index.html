<!doctype html>
<html lang="en" data-theme="paper">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="fnscope workspace: a local-first function inspector with isolated project scopes."
    />
    <title>fnscope workspace</title>
    <script>
      // Apply the persisted palette before first paint; Paper remains the default.
      try {
        var saved = window.localStorage.getItem('fnscope-workspace-theme');
        if (saved === 'paper' || saved === 'graphite') {
          document.documentElement.setAttribute('data-theme', saved);
        }
      } catch (error) {
        // Blocked storage keeps the server-rendered Paper default.
      }
    </script>
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
