name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The origin gate compares changed paths against `main`; PR checkouts are
      # detached, so make sure the ref exists before the culture gate runs.
      - name: Ensure the main ref exists
        run: |
          if ! git rev-parse --verify -q main >/dev/null; then
            git fetch --no-tags origin +refs/heads/main:refs/heads/main
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install UI dependencies
        run: npm ci --prefix ui

      - name: Rebuild the embedded UI
        run: bash ui/build.sh

      - name: Verify the committed UI artifacts
        run: git diff --exit-code -- ui/dist

      - name: UI checks
        run: |
          node ui/scripts/check-ui.mjs
          node ui/scripts/check-ui.mjs --self-test
          npm --prefix ui test

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Workspace tests
        run: cargo test --workspace

      - name: Culture gate
        run: |
          bash scripts/check-culture.sh --self-test
          bash scripts/check-culture.sh

  build:
    name: Build ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-15
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build the release binary
        run: cargo build --release -p fnscope --target ${{ matrix.target }}

      - name: Report the binary version
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/fnscope"
          if [ "${{ runner.os }}" = "Windows" ]; then bin="${bin}.exe"; fi
          "$bin" --version
